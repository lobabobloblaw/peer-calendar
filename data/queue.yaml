  - name: "International Survivors of Suicide Loss Day - Portland (AFSP Oregon)"
    category: peer_support
    priority: high
    notes: >
      Survivor Day 2026 is Saturday, November 21 (the Saturday before Thanksgiving). AFSP
      Oregon hosts a Portland event plus Bend, Hood River, and Pendleton, but the Portland
      venue and time were not published as of 2026-09-16. Area Director Helen Cotton,
      971-375-5509. High value: a free, facilitated day specifically for people bereaved
      by suicide.
      Rechecked 2026-10-14: still no Portland venue or time; AFSP Oregon lists only a Nov 22 'Through a Jewish Lens' event with no location. Recheck around Nov 5.
    source_urls:
      - https://afsp.org/chapter/oregon
      - https://afsp.org/international-survivors-of-suicide-loss-day/
  - name: "Transgender Day of Remembrance vigils - Portland"
    category: peer_support
    priority: high
    notes: >
      TDOR is November 20, 2026. Q Center (4115 N Mississippi Ave), the PSU Queer Resource
      Center, and the Goose Hollow interfaith vigil have all hosted in past years; 2026
      details were not posted as of 2026-09-16. Check pdxqcenter.org/calendar in late
      October.
      Rechecked 2026-10-14: nothing for 2026 from Q Center or Basic Rights Oregon (BRO's guide is still 2025). Recheck around Nov 5.
    source_urls:
      - https://www.pdxqcenter.org/calendar
      - https://www.basicrights.org/
  - name: "Longest Night / Homeless Persons' Memorial vigils"
    category: peer_support
    priority: medium
    notes: >
      December 21, 2026 (winter solstice). Multiple Portland-metro vigils read the names of
      people who died unhoused that year; past hosts include Ecumenical Ministries of
      Oregon and Rose Haven. Organizers usually announce in early December.
      Rechecked 2026-10-14: no Portland, Oregon listings yet. Recheck in early December.
    source_urls:
      - https://emoregon.org/
  - name: "Holiday grief workshops (Coping with the Holidays)"
    category: peer_support
    priority: medium
    notes: >
      Providence, Dougy Center, and Hopewell House all run holiday-season grief programming
      in November and December. Their 2026 dates were not published as of 2026-09-16. Worth
      a single sweep in late October to add them together.
      Rechecked 2026-10-14: Dougy Center's Oct 22 holiday session is a $65 professional webinar - do not add. Providence 'Get Me Through the Holidays' has no 2026 dates (503-215-2273). Hopewell House lists only its monthly grief circle.
    source_urls:
      - https://hopewellhousepdx.org/grief-support/
      - https://www.dougy.org/grief-support-resources/portland-area-support-groups-resources
  - name: "Free Thanksgiving and Christmas community meals 2026"
    category: food_farms
    priority: high
    notes: >
      Union Gospel Mission, Portland Rescue Mission, and Poshines Cafe (the Proper
      Thanksgiving Feast-ival) all serve free holiday meals open to anyone, not only people
      experiencing homelessness. All three organizations are already in the database; what
      is missing is the 2026 holiday dates and hours, which are usually announced in early
      November. Blanchet House is closed both holidays and publishes a list of who is open.
      Rechecked 2026-10-14: no 2026 meal dates from Union Gospel Mission, Portland Rescue Mission, Poshines, or Blanchet House. Poshines is not yet in the database. Recheck around Nov 5.
    source_urls:
      - https://blanchethouse.org/where-to-find-free-thanksgiving-day-meals-and-volunteer-opportunities/
      - https://blanchethouse.org/where-to-eat-for-free-on-christmas-day/
  - name: "Lake Oswego Tree Lighting Festival"
    category: events
    priority: medium
    notes: >
      Free festival at Millennium Plaza Park with caroling, a holiday marketplace, and
      reindeer. 2026 date not yet posted.
      Rechecked 2026-10-14: the Lake Oswego Millennium Concert Band schedule lists the festival on November 27, 2026 (band at 5:45pm), but the city has not posted it. Add once the city confirms.
    source_urls:
      - https://www.ci.oswego.or.us/parksrec/
  - name: "Milwaukie Lights Walk and Umbrella Parade"
    category: events
    priority: medium
    notes: >
      Two separate free Clackamas County events. The Lights Walk is a months-long downtown
      art installation (December through March in the 2025-26 season); the Umbrella Parade
      ends at City Hall with the tree lighting. Neither 2026 date was published as of
      2026-09-16.
      Rechecked 2026-10-14: the city's Umbrella Parade and Winter Solstice pages still show 2025 dates; nothing for the Lights Walk.
    source_urls:
      - https://www.downtownmilwaukie.org/
      - https://www.milwaukieoregon.gov/community/events/umbrella_parade_tree_lighting.php
  - name: "Free Halloween and harvest events - tri-county"
    category: events
    priority: low
    notes: >
      Trick or Treat on Alberta (October 31, 3-6pm, 40+ businesses), BOOverton in downtown
      Beaverton, and the Wood Village Pumpkin Fest at Donald L Robertson Park are all free
      and recur annually, but only 2025 dates were findable on 2026-09-16.
      Rechecked 2026-10-14: Wood Village Pumpkin Fest added as wood-village-pumpkin-fest (Oct 24). The Beaverton Downtown Association blog lists BOOverton on October 25, 2026, but its event page still shows 2025, so no time is confirmed. Nothing for Trick or Treat on Alberta.
    source_urls:
      - https://portlandlivingonthecheap.com/free-halloween-events-portland/
