name: Test Web UI

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/events.json'
      - 'docs/sky-effect.js'
      - 'scripts/generate_calendar.py'
      - 'scripts/test_web_ui_contract.mjs'
      - 'scripts/test_sky_effect_reduced_motion.mjs'
      - 'tests/web-ui.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-web-ui.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/events.json'
      - 'docs/sky-effect.js'
      - 'scripts/generate_calendar.py'
      - 'scripts/test_web_ui_contract.mjs'
      - 'scripts/test_sky_effect_reduced_motion.mjs'
      - 'tests/web-ui.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-web-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check docs/sky-effect.js
          awk 'BEGIN{inside=0} /^[[:space:]]*<script>[[:space:]]*$/{inside=1;next} /^[[:space:]]*<\/script>[[:space:]]*$/{if(inside){exit}} inside{print}' docs/index.html | node --check -

      - name: Run deterministic UI tests
        run: npm run test:web-contract

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility tests
        run: npm run test:web-e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
