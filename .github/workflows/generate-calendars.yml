name: Generate Calendars

on:
  push:
    branches: [main]
    paths:
      - 'data/sources.yaml'
      - 'docs/index.html'
      - 'scripts/generate_calendar.py'
      - 'scripts/generate_guides.py'
      - 'scripts/test_add_update_post.py'
      - 'scripts/test_schedule_parsing.py'
      - 'scripts/audit_policy.py'
      - 'scripts/test_audit_policy.py'
      - 'scripts/test_web_schedule_parity.mjs'
      - 'scripts/utils.py'
      - '.github/workflows/generate-calendars.yml'

  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC (~7am Pacific)

  workflow_dispatch:

concurrency:
  group: calendar-gen
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate sources
        working-directory: scripts
        run: python audit_check.py --validate

      - name: Validate schedules
        working-directory: scripts
        run: python validate_schedules.py

      # The whole suite, not a hand-listed subset: this is the last gate
      # before the feeds subscribers receive are rewritten.
      - name: Run tests
        working-directory: scripts
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Snapshot published events
        run: cp docs/events.json /tmp/events-before.json || true

      - name: Generate calendars and JSON
        working-directory: scripts
        run: python generate_calendar.py --json --publish

      # This test reads the freshly generated events.json and the browser code,
      # so it must run after generation and before anything can be committed.
      - name: Verify web schedule parity
        working-directory: scripts
        run: node test_web_schedule_parity.mjs

      # Keeps guides/resources-guide.md from drifting away from sources.yaml
      # between manual regenerations.
      - name: Generate resource guide
        working-directory: scripts
        run: python generate_guides.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet docs/ guides/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # One auto-post per day to the Updates section; a curated post already
      # present for today suppresses the auto summary (see CLAUDE.md data flow).
      - name: Post update to site
        if: steps.check.outputs.changed == 'true'
        working-directory: scripts
        run: python add_update_post.py --auto --before /tmp/events-before.json --after ../docs/events.json

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ guides/
          git commit -m "Auto-generate calendar feeds and resource guide from sources.yaml"
          # A push landing on main between checkout and here makes this push a
          # non-fast-forward and throws away a completed regeneration.
          git pull --rebase origin main
          git push

      # A failed scheduled run is otherwise invisible: nobody watches the
      # Actions tab on a Monday morning, and published feeds simply stop being
      # refreshed until someone notices. One open issue, updated per failure.
      - name: Report a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Weekly calendar generation is failing'
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The scheduled Generate Calendars run failed on $(date -u +%Y-%m-%d)." \
            "Published calendar feeds are not being refreshed until this is fixed. Subscribers keep whatever the last successful run produced." \
            "Failed run: $RUN_URL")
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
