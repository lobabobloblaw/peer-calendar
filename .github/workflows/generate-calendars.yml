name: Generate Calendars

on:
  push:
    branches: [main]
    paths:
      - 'data/sources.yaml'
      - 'docs/index.html'
      - 'scripts/generate_calendar.py'
      - 'scripts/generate_guides.py'
      - 'scripts/test_add_update_post.py'
      - 'scripts/test_schedule_parsing.py'
      - 'scripts/test_web_schedule_parity.mjs'
      - 'scripts/utils.py'
      - '.github/workflows/generate-calendars.yml'

  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC (~7am Pacific)

  workflow_dispatch:

concurrency:
  group: calendar-gen
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install pyyaml python-dateutil

      - name: Validate sources
        working-directory: scripts
        run: python audit_check.py --validate

      - name: Validate schedules
        working-directory: scripts
        run: python validate_schedules.py

      - name: Run tests
        working-directory: scripts
        run: |
          python test_schedule_parsing.py
          python test_add_update_post.py

      - name: Snapshot published events
        run: cp docs/events.json /tmp/events-before.json || true

      - name: Generate calendars and JSON
        working-directory: scripts
        run: python generate_calendar.py --json --publish

      # This test reads the freshly generated events.json and the browser code,
      # so it must run after generation and before anything can be committed.
      - name: Verify web schedule parity
        working-directory: scripts
        run: node test_web_schedule_parity.mjs

      # Keeps guides/resources-guide.md from drifting away from sources.yaml
      # between manual regenerations.
      - name: Generate resource guide
        working-directory: scripts
        run: python generate_guides.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet docs/ guides/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # One auto-post per day to the Updates section; a curated post already
      # present for today suppresses the auto summary (see CLAUDE.md data flow).
      - name: Post update to site
        if: steps.check.outputs.changed == 'true'
        working-directory: scripts
        run: python add_update_post.py --auto --before /tmp/events-before.json --after ../docs/events.json

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ guides/
          git commit -m "Auto-generate calendar feeds and resource guide from sources.yaml"
          git push
