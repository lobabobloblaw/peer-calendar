name: Check Source URLs

on:
  push:
    branches: [main]
    paths:
      - 'data/sources.yaml'
      - 'scripts/check_source_urls.py'
      - 'scripts/audit_policy.py'
      - 'scripts/utils.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/check-source-urls.yml'
  schedule:
    - cron: '0 15 * * 3' # Wednesdays 15:00 UTC (~8am Pacific)
  workflow_dispatch:

concurrency:
  group: source-url-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # The checker's own tests run on pull requests in the Validate workflow.
      # This workflow deliberately never runs on a pull request, so a URL from
      # an untrusted branch is never requested by a GitHub-hosted runner.
      - name: Check source URL health
        id: live-check
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/check_source_urls.py \
            --sources data/sources.yaml \
            --output artifacts/source-url-report.json \
            --markdown-output artifacts/source-url-summary.md \
            --max-workers 8 \
            --per-host 2 \
            --timeout 12 \
            --retries 1 \
            --fail-on-broken

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f artifacts/source-url-summary.md ]; then
            cat artifacts/source-url-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Source URL health" >> "$GITHUB_STEP_SUMMARY"
            echo "The checker did not produce a report; inspect the live-check logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload URL health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-url-health-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
